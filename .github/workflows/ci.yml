name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check tsqc/

      - name: Run tests with coverage
        run: pytest --cov=tsqc --cov-report=term-missing --cov-fail-under=75

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check tsqc/

  notebooks:
    name: Execute example notebooks
    needs: [test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Execute all example notebooks
        run: |
          set -euo pipefail
          for nb in examples/*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=600 \
              --output-dir=/tmp/nb-output \
              "$nb"
          done

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check agent/doc versions match pyproject.toml
        run: python scripts/check_versions.py
