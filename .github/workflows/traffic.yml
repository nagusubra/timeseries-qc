name: Archive traffic data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-traffic
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Seed existing data from traffic-data
        # main doesn't track .metrics/data, and some datasets (e.g. star/fork
        # history, which GitHub's stargazers restriction can make unavailable)
        # are rebuilt incrementally. Bring over the last archived CSVs so the
        # archiver merges into them instead of starting empty.
        run: |
          git fetch --quiet origin refs/heads/traffic-data:refs/remotes/origin/traffic-data || true
          git checkout origin/traffic-data -- .metrics/data || true
          exit 0

      - name: Archive traffic
        env:
          # github.token 403s on traffic endpoints; a fine-grained PAT with
          # "Administration: read" (secret GH_TRAFFIC_TOKEN) is required.
          GH_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/archive_traffic.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: .metrics/data is gitignored on main but is the point of this branch
          git add -f .metrics doc/metric
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): archive traffic data ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Keep main free of hourly churn: the archive lives on the dedicated
            # traffic-data branch, which the dashboard and badge read from.
            git push --force origin HEAD:traffic-data
          else
            echo "No changes to commit"
          fi
