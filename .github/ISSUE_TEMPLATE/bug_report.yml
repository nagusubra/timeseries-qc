name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
      placeholder: When I run tsqc.check() with my SCADA data...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code to reproduce the issue
      placeholder: |
        ```python
        import tsqc
        import pandas as pd
        
        df = pd.read_csv("sensor_data.csv")
        result = tsqc.check(df, assume_tz="UTC")
        # Bug occurs here...
        ```
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
      placeholder: I expected the quality check to complete without errors...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages if any)
      placeholder: |
        Instead, I got this error:
        ```
        ValueError: ...
        ```
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: timeseries-qc version
      description: Run `python -c "import tsqc; print(tsqc.__version__)"`
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Run `python --version`
      placeholder: "3.11.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: data-source
    attributes:
      label: Data source (optional)
      description: What type of data are you working with?
      placeholder: OSIsoft PI historian, Ignition SCADA, custom CSV files, etc.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might be relevant
      placeholder: This started happening after upgrading from version...
